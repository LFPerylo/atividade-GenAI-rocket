x-app: &app
  build: .
  image: cinerocket:latest
  env_file: .env
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "8000:8000"

  ui:
    <<: *app
    command: ["cinerocket", "ui", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  indexer:
    <<: *app
    command: ["cinerocket", "index", "build"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: ["jobs"]
