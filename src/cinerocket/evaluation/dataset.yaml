- id: receita-top10
  category: Bilheteria e finanças
  question: Quais são os 10 filmes com maior receita em R$?
  reference_sql: |
    SELECT m.titulo, f.receita_brl
    FROM dim_movies m JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.receita_brl > 0
    ORDER BY f.receita_brl DESC LIMIT 10
  value_columns: [1]

- id: lucro-medio-genero
  category: Bilheteria e finanças
  question: Qual o lucro médio por gênero, considerando apenas filmes com receita informada?
  reference_sql: |
    SELECT g.nome_genero, ROUND(AVG(f.lucro_brl), 2) AS lucro_medio_brl
    FROM fact_movies_performance f
    JOIN bridge_movie_genre bg USING (sk_movie_id)
    JOIN dim_genres g USING (sk_genre_id)
    WHERE f.receita_brl > 0
    GROUP BY g.nome_genero ORDER BY lucro_medio_brl DESC
  ordered: false
  value_columns: [1]

- id: margem-top10
  category: Bilheteria e finanças
  question: Quais filmes têm a maior margem de lucro entre os que possuem receita e orçamento informados?
  reference_sql: |
    SELECT m.titulo, ROUND(f.lucro_brl * 100.0 / f.receita_brl, 2) AS margem_pct
    FROM dim_movies m JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.receita_brl > 0 AND f.orcamento_brl > 0
    ORDER BY margem_pct DESC LIMIT 10
  min_overlap: 0.8

- id: populares-top5
  category: Popularidade e engajamento
  question: Quais são os 5 filmes mais populares?
  reference_sql: |
    SELECT m.titulo, f.popularidade
    FROM dim_movies m JOIN fact_movies_performance f USING (sk_movie_id)
    ORDER BY f.popularidade DESC LIMIT 5
  value_columns: [1]

- id: divergencia-tmdb-imdb
  category: Popularidade e engajamento
  question: Quais filmes têm a maior divergência entre a nota TMDB e a nota IMDb?
  reference_sql: |
    SELECT m.titulo, ROUND(ABS(f.nota_tmdb - f.nota_imdb), 2) AS divergencia
    FROM dim_movies m JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.nota_tmdb > 0 AND f.nota_imdb > 0 AND f.qtd_tmdb >= 100 AND f.qtd_imdb >= 100
    ORDER BY divergencia DESC LIMIT 10
  min_overlap: 0.5

- id: imdb-por-ano
  category: Popularidade e engajamento
  question: Qual a nota média IMDb por ano de lançamento?
  reference_sql: |
    SELECT m.ano_lancamento, ROUND(AVG(f.nota_imdb), 2) AS nota_media_imdb
    FROM dim_movies m JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.nota_imdb > 0 AND m.status_filme = 'Lançado'
    GROUP BY m.ano_lancamento ORDER BY m.ano_lancamento
  ordered: false
  min_overlap: 0.8

- id: ator-ultimos-5-anos
  category: Elenco e equipe
  question: Qual ator teve mais participações em filmes lançados nos últimos 5 anos?
  reference_sql: |
    SELECT p.nome_pessoa, COUNT(DISTINCT m.sk_movie_id) AS participacoes
    FROM dim_people p
    JOIN bridge_movie_person b USING (sk_person_id)
    JOIN dim_movies m USING (sk_movie_id)
    WHERE p.tipo_pessoa = 'Ator' AND m.status_filme = 'Lançado'
      AND m.data_lancamento >= DATE('now', '-5 years') AND m.data_lancamento <= DATE('now')
    GROUP BY p.sk_person_id ORDER BY participacoes DESC LIMIT 1

- id: diretores-nota-media
  category: Elenco e equipe
  question: Quais diretores têm a maior nota média, com no mínimo 5 filmes?
  reference_sql: |
    SELECT p.nome_pessoa, ROUND(AVG(f.nota_imdb), 2) AS nota_media
    FROM dim_people p
    JOIN bridge_movie_person b USING (sk_person_id)
    JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE p.tipo_pessoa = 'Diretor' AND f.nota_imdb > 0
    GROUP BY p.sk_person_id HAVING COUNT(DISTINCT b.sk_movie_id) >= 5
    ORDER BY nota_media DESC LIMIT 10
  min_overlap: 0.5

- id: dupla-ator-diretor
  category: Elenco e equipe
  question: Qual dupla ator-diretor mais trabalhou junta?
  reference_sql: |
    SELECT a.nome_pessoa AS ator, d.nome_pessoa AS diretor, COUNT(*) AS filmes_juntos
    FROM bridge_movie_person bd
    JOIN dim_people d ON d.sk_person_id = bd.sk_person_id AND d.tipo_pessoa = 'Diretor'
    JOIN bridge_movie_person ba ON ba.sk_movie_id = bd.sk_movie_id
    JOIN dim_people a ON a.sk_person_id = ba.sk_person_id AND a.tipo_pessoa = 'Ator'
    WHERE a.nome_pessoa <> d.nome_pessoa
    GROUP BY a.sk_person_id, d.sk_person_id ORDER BY filmes_juntos DESC LIMIT 1
  key_columns: [0, 1]

- id: filmes-por-genero
  category: Gêneros e produtoras
  question: Quantos filmes existem por gênero?
  reference_sql: |
    SELECT g.nome_genero, COUNT(DISTINCT bg.sk_movie_id) AS quantidade
    FROM dim_genres g JOIN bridge_movie_genre bg USING (sk_genre_id)
    GROUP BY g.nome_genero ORDER BY quantidade DESC
  ordered: false
  value_columns: [1]

- id: produtora-maior-lucro
  category: Gêneros e produtoras
  question: Qual produtora teve o maior lucro total?
  reference_sql: |
    SELECT c.nome_produtora, ROUND(SUM(f.lucro_brl), 2) AS lucro_total_brl
    FROM dim_companies c
    JOIN bridge_movie_company bc USING (sk_company_id)
    JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.receita_brl > 0 AND f.orcamento_brl > 0
    GROUP BY c.sk_company_id ORDER BY lucro_total_brl DESC LIMIT 1

- id: genero-maior-margem
  category: Gêneros e produtoras
  question: Qual gênero tem a maior margem de lucro média?
  reference_sql: |
    SELECT g.nome_genero, ROUND(SUM(f.lucro_brl) * 100.0 / SUM(f.receita_brl), 2) AS margem_media_pct
    FROM dim_genres g
    JOIN bridge_movie_genre bg USING (sk_genre_id)
    JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE f.receita_brl > 0 AND f.orcamento_brl > 0
    GROUP BY g.nome_genero ORDER BY margem_media_pct DESC LIMIT 1

- id: mais-avaliados-usuarios
  category: Avaliações dos usuários
  question: Quais filmes foram mais avaliados pelos usuários?
  reference_sql: |
    SELECT m.titulo, r.qtd_avaliacoes_usuarios
    FROM dim_reviews r JOIN dim_movies m USING (sk_movie_id)
    ORDER BY r.qtd_avaliacoes_usuarios DESC LIMIT 5
  value_columns: [1]
  min_overlap: 0.6

- id: divergencia-usuarios-imdb
  category: Avaliações dos usuários
  question: Em quais filmes a nota média dos usuários mais diverge da nota IMDb?
  reference_sql: |
    SELECT m.titulo, ROUND(ABS(r.nota_media_usuarios - f.nota_imdb), 2) AS divergencia
    FROM dim_reviews r
    JOIN dim_movies m USING (sk_movie_id)
    JOIN fact_movies_performance f USING (sk_movie_id)
    WHERE r.nota_media_usuarios IS NOT NULL AND f.nota_imdb > 0
    ORDER BY divergencia DESC LIMIT 10
  min_overlap: 0.3
